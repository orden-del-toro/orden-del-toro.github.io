<div class="page" id="page-roster">
  <div class="wrap roster-page-shell">
    <section class="member-dashboard-stats" id="rosterOverview" aria-label="Resumen de miembros"></section>
    <div class="member-dashboard">
      <aside class="member-directory" aria-label="Jugadores">
        <div class="member-directory-heading">
          <h1>JUGADORES</h1>
          <span id="rosterPlayerCount"></span>
        </div>
        <label class="member-search" for="searchInput">
          <span aria-hidden="true">⌕</span>
          <input autocomplete="off" id="searchInput" placeholder="Buscar jugador..." type="search" />
        </label>
        <div class="member-player-list" id="rosterPlayerList"></div>
      </aside>
      <section class="member-profile" id="rosterMemberDetail" aria-live="polite"></section>
    </div>
  </div>
</div>
