<div class="page" id="page-contacto">
<div class="wrap" style="padding-top:30px;padding-bottom:30px;">
<h2 style="font-family:'Cinzel',serif;color:var(--gold-light);margin-bottom:20px;">CONTACTO</h2>
<div class="panel" style="max-width:600px;margin:0 auto;padding:30px;">
<p style="color:var(--text-muted);margin-bottom:20px;">Ponte en contacto con la oficialía de la hermandad.</p>
<form class="contact-form" onsubmit="enviarSolicitud(event, 'contacto')">
<label style="color:var(--text-muted);">Tu nombre</label>
<input name="nombre" placeholder="Nombre" required="" type="text"/>
<label style="color:var(--text-muted);margin-top:15px;">Correo</label>
<input name="email" placeholder="correo@ejemplo.com" required="" type="email"/>
<label style="color:var(--text-muted);margin-top:15px;">Mensaje</label>
<textarea name="mensaje" placeholder="Escribe tu mensaje aquí..." required="" rows="5"></textarea>
<button class="panel-cta" style="display:inline-block;padding:12px 40px;margin-top:20px;" type="submit">ENVIAR</button>
</form>
<div style="margin-top:25px;border-top:1px solid var(--border);padding-top:20px;color:var(--text-muted);">
<p>💬 Discord: <a href="https://discord.gg/WdQYscBH7x" style="color:var(--gold-light);" target="_blank">Unirse al servidor</a></p>
</div>
</div>
</div>
</div>
